<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you — Trovul</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="icon" type="image/png" href="img/logo-small.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css?v=2">
    <style>
        .done {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
        }

        .done-box {
            max-width: 520px;
        }

        .done svg.mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            filter: drop-shadow(0 0 28px rgba(139, 92, 246, 0.6));
        }

        .done h1 {
            font-size: clamp(34px, 6vw, 52px);
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .done p {
            margin: 16px 0 32px;
            color: var(--text-2);
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="backdrop" aria-hidden="true">
        <div class="glow glow-a"></div>
        <div class="glow glow-b"></div>
        <div class="grid-lines"></div>
    </div>
    <main class="done">
        <div class="done-box">
            <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
                <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#a78bfa" />
                        <stop offset="55%" stop-color="#22d3ee" />
                        <stop offset="100%" stop-color="#34d399" />
                    </linearGradient>
                </defs>
                <path d="M75 20 A35 35 0 0 1 75 80" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" />
                <path d="M25 80 A35 35 0 0 1 25 20" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" opacity="0.55" />
                <circle cx="40" cy="36" r="8" fill="#a78bfa" opacity="0.75" />
                <circle cx="60" cy="64" r="8" fill="#22d3ee" />
            </svg>
            <h1 id="title">You're on the list!</h1>
            <p id="text">Thanks for your interest in Trovul. We'll let you know as soon as early access opens.</p>
            <a href="/" class="btn btn-primary btn-lg" id="back">Back to trovul.com</a>
        </div>
    </main>
    <script>
        let saved = null;
        try { saved = localStorage.getItem("trovul.lang"); } catch { /* private mode */ }
        if (/^pt/i.test(saved || navigator.language || "")) {
            document.documentElement.lang = "pt-BR";
            document.title = "Obrigado — Trovul";
            document.getElementById("title").textContent = "Você está na lista!";
            document.getElementById("text").textContent = "Obrigado pelo interesse no Trovul. Avisamos assim que o acesso antecipado abrir.";
            document.getElementById("back").textContent = "Voltar para trovul.com";
        }
    </script>
</body>

</html>
